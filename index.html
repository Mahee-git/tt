<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Tennis Knockout</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5ff;--card:#fff;--tx:#1b1f3b;--mut:#8a90b0;--bd:#e4e7f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 10% 0%,#e9e6ff 0,transparent 40%),radial-gradient(circle at 95% 10%,#d9f5ff 0,transparent 35%),var(--bg);color:var(--tx);font-family:Inter,Arial,sans-serif;min-height:100%}
header{padding:22px 24px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 26px "Chakra Petch",Arial,sans-serif;letter-spacing:.04em;background:linear-gradient(90deg,#4f7cff,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.pill{padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--bd)}
label.btn{background:linear-gradient(90deg,#4f7cff,#8b5cf6);color:#fff;border-radius:99px;padding:8px 16px;font:600 12px Inter,Arial;cursor:pointer;box-shadow:0 4px 12px rgba(79,124,255,.3)}
#hint{padding:0 24px;font-size:12px;color:var(--mut)}
.board{display:flex;gap:20px;padding:16px 24px 28px;overflow-x:auto;align-items:stretch}
.col{min-width:270px;display:flex;flex-direction:column;gap:12px;--c:#4f7cff}
.col h2{margin:0;font:700 12px "Chakra Petch",Arial;text-transform:uppercase;letter-spacing:.14em;color:var(--c);display:flex;align-items:center;gap:8px}
.col h2::after{content:"";flex:1;height:2px;background:var(--c);opacity:.25;border-radius:2px}
.m{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;padding:10px;box-shadow:0 6px 18px rgba(60,70,140,.07)}
.id{font:700 11px "Chakra Petch",Arial;color:var(--c);margin-bottom:6px;letter-spacing:.1em}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13px}
.row+.row{margin-top:4px}
.row.w{background:color-mix(in srgb,var(--c) 14%,white);font-weight:600}
.row.ph .nm{color:var(--mut);font-style:italic}
.nm{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;padding:2px 0;overflow:hidden;text-overflow:ellipsis}
input.nm{border-bottom:1px dashed var(--bd);outline:0}
input.nm:focus{border-bottom-color:var(--c)}
input.s{width:40px;padding:5px 2px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:#fafbff;font:700 13px "Chakra Petch",Arial;color:var(--tx)}
input.s:focus{outline:2px solid var(--c);border-color:transparent}
.sc{min-width:28px;text-align:center;font:700 14px "Chakra Petch",Arial;color:var(--c)}
#champ{margin:4px 24px 0;padding:14px 18px;border-radius:16px;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);color:#fff;display:none;font:700 18px "Chakra Petch",Arial;box-shadow:0 8px 22px rgba(139,92,246,.3)}
</style></head><body>
<header><h1>🏓 TABLE TENNIS KNOCKOUT</h1>
<div class="tools"><span class="pill" id="st">Connecting…</span>
<label class="btn" id="dl" style="display:none">Download data.json</label>
<label class="btn" id="impl" style="display:none">Import Excel<input type="file" id="f" accept=".xlsx" hidden></label></div></header>
<div id="hint"></div>
<div id="champ"></div>
<div class="board" id="b"></div>
<script>
const T={1:"Nur Mohammad - Shipon",2:"Shefat - Nasrullah",3:"Nadim - Rasel",4:"Tawhaa - Siam",5:"Rupok - Rifat",6:"Taiabe Hasan Talash - Ridvi",7:"Jimin - Kaif",8:"Syed Abrar Sahriar - Joy Paul Arko",9:"Minhaj Mahin - Kawshik Debnath",10:"Mahmudul Hasan - Sharafatul Shihab",11:"Tanvir Shourav - Prottasha",12:"Tanziba Afrin - Tasin Tanha",13:"Swapnil Samundho - Muammar Tajoar Faiaz",14:"MD. Zamiul Hoque - Nabela Rahman",15:"Rafiu - Syed Wasiul Islam",16:"Abu Siam - Anay Kumar Sikdar",17:"Md Omar Faruq (Sadid) - Nujhat Nujaifa",18:"A.B.M Mehedi Hasan - Mobashshir Sobhan",19:"Mohaimen sir - Tanvir sir (Faculty)"};
const t=i=>i+". "+T[i];
const COL={"Round 1":"#4f7cff","Round 2":"#14b8a6","Quarterfinal":"#f59e0b","Semifinal":"#ec4899","Final":"#8b5cf6"};
const M=[];
for(let i=1;i<=8;i++)M.push(["Round 1","R1-"+i,t(i),t(19-i)]);
M.push(["Round 1","R1-9",t(9),t(10)]);
M.push(["Round 2","R2-1","Winner R1-6","Winner R1-9"],["Round 2","R2-2","Winner R1-7","Winner R1-8"],
["Quarterfinal","QF1","Winner R1-1","Winner R2-1"],["Quarterfinal","QF2","Winner R1-4","Winner R1-5"],
["Quarterfinal","QF3","Winner R1-2","Winner R2-2"],["Quarterfinal","QF4","Winner R1-3",t(19)],
["Semifinal","SF1","Winner QF1","Winner QF2"],["Semifinal","SF2","Winner QF3","Winner QF4"],["Final","Final","Winner SF1","Winner SF2"]);
let S={},N={},canWrite=false,ref=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isW=n=>/^Winner /.test(n);
function slot(m,k){const raw=m[2+k];if(isW(raw))return res(raw);return N[m[1]+":"+k]??raw}
function res(n){const id=n.slice(7),m=M.find(x=>x[1]===id);return winner(m)}
function winner(m){const s=S[m[1]];if(!s||s[0]===""||s[1]===""||s[0]==null||s[1]==null||+s[0]===+s[1])return null;return +s[0]>+s[1]?slot(m,0):slot(m,1)}
function render(){
 const cols={};M.forEach(m=>(cols[m[0]]=cols[m[0]]||[]).push(m));
 let h="";
 for(const r in cols){h+=`<div class="col" style="--c:${COL[r]}"><h2>${r}</h2>`;
  for(const m of cols[r]){const w=winner(m),s=S[m[1]]||["",""];
   const row=k=>{const raw=m[2+k],n=slot(m,k),ph=isW(raw)&&!n;
    const name=(canWrite&&!isW(raw))?`<input class="nm" data-m="${m[1]}" data-k="${k}" data-t="n" value="${esc(n)}">`:`<span class="nm">${esc(n||raw)}</span>`;
    const sc=canWrite?`<input class="s" type="number" min="0" data-m="${m[1]}" data-k="${k}" data-t="s" value="${esc(s[k]??"")}">`:`<b class="sc">${esc(s[k]??"")}</b>`;
    return `<div class="row ${ph?"ph":""} ${w&&w===n?"w":""}">${name}${sc}</div>`};
   h+=`<div class="m"><div class="id">${m[1]}</div>${row(0)}${row(1)}</div>`}
  h+="</div>"}
 document.getElementById("b").innerHTML=h;
 const c=winner(M[M.length-1]),ch=document.getElementById("champ");
 ch.style.display=c?"block":"none";ch.textContent=c?"🏆 Champion: "+c:"";
}
async function save(){try{localStorage.setItem("bracket-draft",JSON.stringify({scores:S,names:N}));document.getElementById("st").textContent="Draft saved · download data.json & commit"}catch(x){}}
document.getElementById("b").addEventListener("change",e=>{
 const d=e.target.dataset;if(!d.m||!ref)return;
 if(d.t==="s"){const s=(S[d.m]||["",""]).slice();s[d.k]=e.target.value;S={...S,[d.m]:s}}
 else{N={...N,[d.m+":"+d.k]:e.target.value.trim()}}
 render();save();
});
document.getElementById("f").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f||!ref)return;
 try{const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  const ns={},nn={};rows.forEach(r=>{const m=M.find(x=>x[1]===r["Match"]);if(!m)return;
   ns[m[1]]=[r["Score A"]??"",r["Score B"]??""];
   [["Team A",0],["Team B",1]].forEach(([c,k])=>{const v=r[c];if(v&&!isW(m[2+k])&&!isW(String(v)))nn[m[1]+":"+k]=String(v)})});
  S=ns;N=nn;render();await save();document.getElementById("st").textContent="Imported ✓"}
 catch(x){document.getElementById("st").textContent="Import failed"}
 e.target.value="";
});
render();
document.getElementById("dl").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({scores:S,names:N},null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="data.json";a.click();URL.revokeObjectURL(u)};
(async()=>{
 const st=document.getElementById("st");
 canWrite=new URLSearchParams(location.search).has("edit");
 let d={};
 try{const r=await fetch("data.json?"+Date.now());if(r.ok)d=await r.json()}catch(e){}
 if(canWrite){try{const l=localStorage.getItem("bracket-draft");if(l)d=JSON.parse(l)}catch(e){}
  ref=true;document.getElementById("impl").style.display="";document.getElementById("dl").style.display="";
  document.getElementById("hint").textContent="Edit mode: click team names to change them, type scores. Then click Download data.json and upload it to your repo to publish for everyone.";
  st.textContent="Editing (draft)"}
 else{st.textContent="Live";setInterval(async()=>{try{const r=await fetch("data.json?"+Date.now());if(r.ok){const x=await r.json();S=x.scores||{};N=x.names||{};render()}}catch(e){}},30000)}
 S=d.scores||{};N=d.names||{};render();
})();
</script></body></html>
